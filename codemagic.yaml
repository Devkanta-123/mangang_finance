workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mangang.finance 

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          flutter clean
          flutter pub get

          flutter build ipa --release

          echo "========================================"
          echo "Checking for generated IPA..."
          echo "========================================"

          find build/ios -name "*.ipa" -type f -print

    artifacts:
      - build/ios/ipa/*.ipa