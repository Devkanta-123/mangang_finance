workflows:
  ios-release:
    name: Mangang Finance iOS Release
    instance_type: mac_mini_m1
    max_build_duration: 60

    # ========================================
    # App Store Connect integration
    # ========================================
    #
    # IMPORTANT:
    # Replace YOUR_INTEGRATION_NAME with the exact
    # App Store Connect API key/integration name
    # shown in Codemagic.
    #
    integrations:
      app_store_connect: YOUR_INTEGRATION_NAME

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - IOS_SIGNING

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mangang.finance

    # ========================================
    # Build scripts
    # ========================================

    scripts:

      # ----------------------------------------
      # Flutter dependencies
      # ----------------------------------------

      - name: Get Flutter packages
        script: |
          set -e

          echo "========================================"
          echo "Flutter dependencies"
          echo "========================================"

          flutter pub get


      # ----------------------------------------
      # CocoaPods
      # ----------------------------------------

      - name: Install CocoaPods
        script: |
          set -e

          echo "========================================"
          echo "Installing CocoaPods"
          echo "========================================"

          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "No Podfile found."
          fi


      # ----------------------------------------
      # Code signing
      # ----------------------------------------

      - name: Set up iOS code signing
        script: |
          set -e

          echo "========================================"
          echo "Setting up iOS code signing"
          echo "========================================"

          xcode-project use-profiles


      # ----------------------------------------
      # Verify signing
      # ----------------------------------------

      - name: Verify signing
        script: |
          set -e

          echo "========================================"
          echo "Signing identities"
          echo "========================================"

          security find-identity -v -p codesigning

          echo "========================================"
          echo "Provisioning profiles"
          echo "========================================"

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            || true


      # ----------------------------------------
      # Build IPA
      # ----------------------------------------

      - name: Build iOS IPA
        script: |
          set -e

          echo "========================================"
          echo "Cleaning Flutter project"
          echo "========================================"

          flutter clean

          echo "========================================"
          echo "Getting Flutter packages"
          echo "========================================"

          flutter pub get

          echo "========================================"
          echo "Building iOS IPA"
          echo "========================================"

          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

          echo "========================================"
          echo "IPA files"
          echo "========================================"

          find build/ios \
            -type f \
            -name "*.ipa" \
            -print

          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"


    # ========================================
    # Artifacts
    # ========================================

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


    # ========================================
    # App Store Connect / TestFlight
    # ========================================

    publishing:
      app_store_connect:

        # Use the App Store Connect integration
        # configured above.
        auth: integration

        # Upload the IPA to App Store Connect
        # and submit it to TestFlight.
        submit_to_testflight: true