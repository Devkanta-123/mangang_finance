workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - IOS_SIGNING

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mangang.finance
        certificates:
          - mangang_distribution
        provisioning_profiles:
          - mangang_finance_appstore

    scripts:

      # ========================================
      # Get Flutter dependencies
      # ========================================

      - name: Get Flutter packages
        script: |
          set -e

          echo "========================================"
          echo "Getting Flutter packages"
          echo "========================================"

          flutter pub get


      # ========================================
      # Install CocoaPods
      # ========================================

      - name: Install CocoaPods
        script: |
          set -e

          echo "========================================"
          echo "Installing CocoaPods"
          echo "========================================"

          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
            echo "CocoaPods installation completed."
          else
            echo "No Podfile found."
            echo "Skipping CocoaPods."
          fi


      # ========================================
      # Verify iOS signing
      # ========================================

      - name: Verify iOS signing
        script: |
          set -e

          echo "========================================"
          echo "Checking signing identities"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning

          echo "========================================"
          echo "Checking provisioning profiles"
          echo "========================================"

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            || true

          echo "========================================"
          echo "Signing setup check completed"
          echo "========================================"


      # ========================================
      # Verify ExportOptions.plist
      # ========================================

      - name: Verify ExportOptions
        script: |
          set -e

          echo "========================================"
          echo "Checking ExportOptions.plist"
          echo "========================================"

          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "ERROR: ios/ExportOptions.plist does not exist."
            exit 1
          fi

          cat ios/ExportOptions.plist

          echo "========================================"
          echo "ExportOptions.plist found"
          echo "========================================"


      # ========================================
      # Build IPA
      # ========================================

      - name: Build iOS IPA
        script: |
          set -e

          echo "========================================"
          echo "Cleaning Flutter project"
          echo "========================================"

          flutter clean

          echo "========================================"
          echo "Getting Flutter packages"
          echo "========================================"

          flutter pub get

          echo "========================================"
          echo "Building signed iOS IPA"
          echo "========================================"

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

          echo "========================================"
          echo "Checking generated IPA"
          echo "========================================"

          find build/ios \
            -type f \
            -name "*.ipa" \
            -print

          echo "========================================"
          echo "IPA BUILD COMPLETED"
          echo "========================================"


    artifacts:
      - build/ios/ipa/*.ipa