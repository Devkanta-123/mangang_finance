      - name: Install iOS signing certificate
        script: |
          set -e

          echo "========================================"
          echo "Decoding PKCS12 certificate"
          echo "========================================"

          echo "$CM_CERTIFICATE" | base64 --decode > distribution.p12

          echo "Validating PKCS12..."
          openssl pkcs12 \
            -in distribution.p12 \
            -noout \
            -passin env:CM_CERTIFICATE_PASSWORD

          echo "PKCS12 validation successful."

          echo "========================================"
          echo "Creating temporary keychain"
          echo "========================================"

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "========================================"
          echo "Extracting certificate"
          echo "========================================"

          openssl pkcs12 \
            -in distribution.p12 \
            -clcerts \
            -nokeys \
            -out distribution_cert.pem \
            -passin env:CM_CERTIFICATE_PASSWORD

          echo "========================================"
          echo "Extracting private key"
          echo "========================================"

          openssl pkcs12 \
            -in distribution.p12 \
            -nocerts \
            -nodes \
            -out distribution_key.pem \
            -passin env:CM_CERTIFICATE_PASSWORD

          echo "========================================"
          echo "Importing certificate"
          echo "========================================"

          security import distribution_cert.pem \
            -k build.keychain \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Certificate imported."

          echo "========================================"
          echo "Importing private key"
          echo "========================================"

          security import distribution_key.pem \
            -k build.keychain \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          echo "Private key imported."

          echo "========================================"
          echo "Configuring keychain"
          echo "========================================"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            build.keychain

          echo "========================================"
          echo "iOS signing setup complete"
          echo "========================================"