workflows:
  ios-release:
    name: Mangang Finance iOS Release
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - IOS_SIGNING

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mangang.finance

    scripts:

      - name: Get Flutter packages
        script: |
          set -e

          echo "========================================"
          echo "Flutter dependencies"
          echo "========================================"

          flutter pub get


      - name: Install CocoaPods
        script: |
          set -e

          echo "========================================"
          echo "Installing CocoaPods"
          echo "========================================"

          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "No Podfile found."
          fi


      - name: Set up iOS code signing
        script: |
          set -e

          echo "========================================"
          echo "Setting up iOS code signing"
          echo "========================================"

          xcode-project use-profiles


      - name: Verify signing
        script: |
          set -e

          echo "========================================"
          echo "Signing identities"
          echo "========================================"

          security find-identity -v -p codesigning

          echo "========================================"
          echo "Provisioning profiles"
          echo "========================================"

          ls -lah "$HOME/Library/MobileDevice/Provisioning Profiles" || true


      - name: Build iOS IPA
        script: |
          set -e

          echo "========================================"
          echo "Cleaning Flutter project"
          echo "========================================"

          flutter clean

          echo "========================================"
          echo "Getting packages"
          echo "========================================"

          flutter pub get

          echo "========================================"
          echo "Building iOS IPA"
          echo "========================================"

          flutter build ipa --release

          echo "========================================"
          echo "IPA files"
          echo "========================================"

          find build/ios \
            -type f \
            -name "*.ipa" \
            -print

          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"


    artifacts:
      - build/ios/ipa/*.ipa