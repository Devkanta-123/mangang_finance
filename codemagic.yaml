workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - IOS_SIGNING

      ios_signing:
        certificates:
          - mangang_distribution
        provisioning_profiles:
          - mangang_finance_appstore

    scripts:

      # ========================================
      # Flutter dependencies
      # ========================================

      - name: Get Flutter packages
        script: |
          set -e

          echo "========================================"
          echo "Getting Flutter packages"
          echo "========================================"

          flutter pub get


      # ========================================
      # CocoaPods
      # ========================================

      - name: Install CocoaPods
        script: |
          set -e

          echo "========================================"
          echo "Installing CocoaPods"
          echo "========================================"

          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "No Podfile found. Skipping CocoaPods."
          fi


      # ========================================
      # Verify signing
      # ========================================

      - name: Verify iOS signing
        script: |
          set -e

          echo "========================================"
          echo "Signing identities"
          echo "========================================"

          security find-identity -v -p codesigning

          echo "========================================"
          echo "Provisioning profiles"
          echo "========================================"

          ls -lah "$HOME/Library/MobileDevice/Provisioning Profiles" || true


      # ========================================
      # Verify ExportOptions.plist
      # ========================================

      - name: Verify ExportOptions
        script: |
          set -e

          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "ERROR: ios/ExportOptions.plist not found."
            exit 1
          fi

          echo "========================================"
          echo "ExportOptions.plist"
          echo "========================================"

          cat ios/ExportOptions.plist


      # ========================================
      # Build IPA
      # ========================================

      - name: Build iOS IPA
        script: |
          set -e

          echo "========================================"
          echo "Cleaning Flutter project"
          echo "========================================"

          flutter clean

          echo "========================================"
          echo "Getting packages"
          echo "========================================"

          flutter pub get

          echo "========================================"
          echo "Building iOS IPA"
          echo "========================================"

          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

          echo "========================================"
          echo "IPA files"
          echo "========================================"

          find build/ios \
            -type f \
            -name "*.ipa" \
            -print

          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"


    artifacts:
      - build/ios/ipa/*.ipa