workflows:
  ios-release:
    name: Mangang Finance iOS Release
    instance_type: mac_mini_m1
    max_build_duration: 60

    # ========================================
    # App Store Connect integration
    # ========================================

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - IOS_SIGNING

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mangang.finance

    # ========================================
    # Build scripts
    # ========================================

    scripts:

      # ----------------------------------------
      # Flutter dependencies
      # ----------------------------------------

      - name: Get Flutter packages
        script: |
          set -e

          echo "========================================"
          echo "Flutter dependencies"
          echo "========================================"

          flutter pub get


      # ----------------------------------------
      # CocoaPods
      # ----------------------------------------

      - name: Install CocoaPods
        script: |
          set -e

          echo "========================================"
          echo "Installing CocoaPods"
          echo "========================================"

          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "No Podfile found."
          fi


      # ----------------------------------------
      # Code signing
      # ----------------------------------------

      - name: Set up iOS code signing
        script: |
          set -e

          echo "========================================"
          echo "Setting up iOS code signing"
          echo "========================================"

          xcode-project use-profiles


      # ----------------------------------------
      # Verify signing
      # ----------------------------------------

      - name: Verify signing
        script: |
          set -e

          echo "========================================"
          echo "Signing identities"
          echo "========================================"

          security find-identity -v -p codesigning

          echo "========================================"
          echo "Provisioning profiles"
          echo "========================================"

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            || true


      # ----------------------------------------
      # Install screenshot processing tools
      # ----------------------------------------

      - name: Install screenshot tools
        script: |
          set -e

          echo "========================================"
          echo "Installing Pillow"
          echo "========================================"

          python3 -m pip install --user Pillow

          echo "Pillow installation completed."


      # ----------------------------------------
      # Prepare App Store screenshots
      # ----------------------------------------

      - name: Prepare App Store screenshots
        script: |
          set -e

          echo "========================================"
          echo "Preparing App Store screenshots"
          echo "========================================"

          INPUT_DIR="screenshots"
          OUTPUT_DIR="build/app_store_screenshots"

          TARGET_WIDTH=1284
          TARGET_HEIGHT=2778

          mkdir -p "$OUTPUT_DIR"

          # ----------------------------------------
          # Check screenshot folder
          # ----------------------------------------

          if [ ! -d "$INPUT_DIR" ]; then
            echo "ERROR: screenshots/ folder not found."
            exit 1
          fi

          # ----------------------------------------
          # Process screenshots
          # ----------------------------------------

          python3 <<'PY'
          from PIL import Image
          import glob
          import os
          import sys

          INPUT_DIR = "screenshots"
          OUTPUT_DIR = "build/app_store_screenshots"

          TARGET_WIDTH = 1284
          TARGET_HEIGHT = 2778

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          patterns = [
              "*.png",
              "*.jpg",
              "*.jpeg",
              "*.PNG",
              "*.JPG",
              "*.JPEG"
          ]

          files = []

          for pattern in patterns:
              files.extend(
                  glob.glob(
                      os.path.join(INPUT_DIR, pattern)
                  )
              )

          files = sorted(set(files))

          if not files:
              print("ERROR: No screenshots found.")
              sys.exit(1)

          print("")
          print("========================================")
          print("SCREENSHOTS FOUND")
          print("========================================")
          print(f"Total: {len(files)}")

          if len(files) > 10:
              print("WARNING: More than 10 screenshots found.")
              print("Only the first 10 will be processed.")
              files = files[:10]

          # ----------------------------------------
          # Process screenshots
          # ----------------------------------------

          for index, file in enumerate(files, start=1):

              print("")
              print("----------------------------------------")
              print(f"Processing screenshot {index}")
              print(f"File: {file}")
              print("----------------------------------------")

              try:
                  image = Image.open(file)

                  original_width, original_height = image.size

                  print(
                      f"Original size: "
                      f"{original_width}x{original_height}"
                  )

                  image = image.convert("RGB")

                  # --------------------------------
                  # Preserve aspect ratio
                  # --------------------------------

                  scale = max(
                      TARGET_WIDTH / original_width,
                      TARGET_HEIGHT / original_height
                  )

                  new_width = round(
                      original_width * scale
                  )

                  new_height = round(
                      original_height * scale
                  )

                  print(
                      f"Scaled size: "
                      f"{new_width}x{new_height}"
                  )

                  image = image.resize(
                      (new_width, new_height),
                      Image.Resampling.LANCZOS
                  )

                  # --------------------------------
                  # Center crop
                  # --------------------------------

                  left = (
                      new_width - TARGET_WIDTH
                  ) // 2

                  top = (
                      new_height - TARGET_HEIGHT
                  ) // 2

                  right = left + TARGET_WIDTH
                  bottom = top + TARGET_HEIGHT

                  image = image.crop(
                      (
                          left,
                          top,
                          right,
                          bottom
                      )
                  )

                  # --------------------------------
                  # Output
                  # --------------------------------

                  output = os.path.join(
                      OUTPUT_DIR,
                      f"screenshot_{index}.jpg"
                  )

                  image.save(
                      output,
                      "JPEG",
                      quality=95,
                      optimize=True
                  )

                  # --------------------------------
                  # Verify
                  # --------------------------------

                  final_image = Image.open(output)

                  final_width, final_height = (
                      final_image.size
                  )

                  print(
                      f"Final size: "
                      f"{final_width}x{final_height}"
                  )

                  if (
                      final_width != TARGET_WIDTH
                      or
                      final_height != TARGET_HEIGHT
                  ):
                      print(
                          "ERROR: Final dimensions are incorrect."
                      )
                      sys.exit(1)

                  print(
                      f"Created: {output}"
                  )

              except Exception as error:
                  print(
                      f"ERROR processing {file}: {error}"
                  )
                  sys.exit(1)

          # ----------------------------------------
          # Final summary
          # ----------------------------------------

          print("")
          print("========================================")
          print("SCREENSHOT PREPARATION COMPLETED")
          print("========================================")

          generated = sorted(
              glob.glob(
                  os.path.join(
                      OUTPUT_DIR,
                      "*.jpg"
                  )
              )
          )

          print("")
          print("Generated screenshots:")

          for file in generated:

              image = Image.open(file)

              print(
                  f"  {os.path.basename(file)} "
                  f"-> {image.size[0]}x{image.size[1]}"
              )

          print("")
          print(
              f"Total generated: {len(generated)}"
          )

          if not generated:
              print("ERROR: No screenshots generated.")
              sys.exit(1)

          print("")
          print("All screenshots are ready for")
          print("App Store Connect 6.5-inch display.")

          PY

          echo ""
          echo "========================================"
          echo "SCREENSHOT ARTIFACTS"
          echo "========================================"

          ls -lah build/app_store_screenshots/


      # ----------------------------------------
      # Export screenshots to Codemagic artifacts
      # ----------------------------------------

      - name: Export App Store screenshots
        script: |
          set -e

          echo "========================================"
          echo "Exporting App Store screenshots"
          echo "========================================"

          mkdir -p "$CM_EXPORT_DIR/app_store_screenshots"

          cp -v \
            build/app_store_screenshots/*.jpg \
            "$CM_EXPORT_DIR/app_store_screenshots/"

          echo ""
          echo "Screenshots exported to:"
          echo "$CM_EXPORT_DIR/app_store_screenshots/"

          echo ""
          echo "Exported screenshots:"
          ls -lah "$CM_EXPORT_DIR/app_store_screenshots/"


      # ----------------------------------------
      # Build IPA
      # ----------------------------------------

      - name: Build iOS IPA
        script: |
          set -e

          echo "========================================"
          echo "Cleaning Flutter project"
          echo "========================================"

          flutter clean

          echo "========================================"
          echo "Getting Flutter packages"
          echo "========================================"

          flutter pub get

          echo "========================================"
          echo "Building iOS IPA"
          echo "========================================"

          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

          echo "========================================"
          echo "IPA files"
          echo "========================================"

          find build/ios \
            -type f \
            -name "*.ipa" \
            -print

          echo "========================================"
          echo "BUILD COMPLETED"
          echo "========================================"


    # ========================================
    # Artifacts
    # ========================================

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


    # ========================================
    # App Store Connect / TestFlight
    # ========================================

    publishing:
      app_store_connect:

        auth: integration

        submit_to_testflight: true