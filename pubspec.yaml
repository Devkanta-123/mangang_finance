name: mangang_finance
description: A finance management application
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.16.0
  file_picker: ^12.0.0
  csv: ^8.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  excel: ^4.0.6
  audioplayers: ^6.8.1
  # No OTP packages - we'll use custom implementation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icon/
    - assets/sounds/
    - assets/template/